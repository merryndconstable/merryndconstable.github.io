- title: "Chimpanzees demonstrate a behavioural signature of human joint action"
  authors: "Merryn Constable, Emma Suvi Mcewen, Günther Knoblich, Callum Gibson, Amanda Addison, Sophia Nestor, Josep Call"
  year: "2024"
  month: "05"
  day: "01"
  journal: "Cognition"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1016/j.cognition.2024.105747"
  url: "https://doi.org/10.1016/j.cognition.2024.105747"
  description: "The strength of human society can largely be attributed to the tendency to work together to achieve outcomes that are not possible alone. Effective social coordination benefits from mentally representing a partner's actions. Specifically, humans optimize social coordination by forming internal action models adapted to joint rather than individual task demands. To what extent do humans share the cognitive mechanisms that support optimal human coordination and collaboration with other species? An ecologically inspired joint handover-to-retrieve task was systematically manipulated across several experiments to assess whether joint action planning in chimpanzees reflects similar patterns to humans. Chimpanzees' chosen handover locations shifted towards the location of the experimenter's free or unobstructed hand, suggesting they represent the constraints of the joint task even though their individual half of the task was unobstructed. These findings indicate that chimpanzees and humans may share common cognitive mechanisms or predispositions that support joint action."

- title: "Social gaze cueing elicits facilitatory and inhibitory effects on movement execution when the model might act on an object"
  authors: "Xiaoye Michael Wang, April Karlinsky, Merryn Constable, Samantha  Gregory, Timothy N. Welsh"
  year: "2024"
  month: "02"
  day: "01"
  journal: "Quarterly Journal of Experimental Psychology"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.31234/osf.io/9dgpm"
  url: "https://doi.org/10.31234/osf.io/9dgpm"
  description: "Social cues, such as eye gaze and pointing fingers, can increase the prioritisation of specific locations for cognitive processing. A previous study using a manual reaching task showed that, although both gaze and pointing cues altered target prioritisation (reaction times [RTs]), only pointing cues affected action execution (trajectory deviations). These differential effects of gaze and pointing cues on action execution could be because the gaze cue was conveyed through a disembodied head; hence, the model lacked the potential for a body part (i.e., hands) to interact with the target. In the present study, the image of a male gaze model, whose gaze direction coincided with two potential target locations, was centrally presented. The model either had his arms and hands extended underneath the potential target locations, indicating the potential to act on the targets (Experiment 1), or had his arms crossed in front of his chest, indicating the absence of potential to act (Experiment 2). Participants reached to a target that followed a nonpredictive gaze cue at one of three stimulus onset asynchronies. RTs and reach trajectories of the movements to cued and uncued targets were analysed. RTs showed a facilitation effect for both experiments, whereas trajectory analysis revealed facilitatory and inhibitory effects, but only in Experiment 1 when the model could potentially act on the targets. The results of this study suggested that when the gaze model had the potential to interact with the cued target location, the model’s gaze affected not only target prioritisation but also movement execution."

