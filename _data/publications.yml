- title: "Activation of the motor system following gaze cues is determined by hand access, not hand proximity"
  authors: "Xiaoye Michael Wang, Cassie H.Y. Chan, Yiru Wang, April Karlinsky, Merryn Constable, Timothy Welsh"
  year: "2025"
  month: "11"
  day: "01"
  journal: "Quarterly Journal of Experimental Psychology"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1177/17470218251318311"
  url: "https://doi.org/10.1177/17470218251318311"
  description: "The influence of gaze cues on target prioritisation (reaction times [RTs]) and movement execution (movement trajectories) differs based on the ability of the human gaze cue model to manually interact with the targets. Whereas gaze cues consistently impacted RTs, movement trajectories may only be affected when the hands of the human model had the potential to interact with the target. However, the perceived ability to interact with the targets was confounded by the proximity between the model’s hands and the targets. The current study explored if the influence of gaze cues on movement trajectories is shaped by the model’s potential to access and interact with the targets using their hands or simply the proximity of the hands. A centrally presented human model randomly gazed towards one of two peripheral target locations. Participants executed aiming movements to targets that non-predictively appeared at one location at a stimulus onset asynchrony of 100, 350, or 850 ms. In Experiment 1, the model’s hands could not directly access the targets as each was holding a tray. In Experiment 2, the hands had direct access to the targets, but their palms-downwards orientation and wrist-flexed posture rendered efficiently interacting with the targets unlikely. Although RTs showed a facilitation effect of the gaze cue in both experiments, changes in movement trajectories were only observed when the model had direct access to the target (Experiment 2). The results of the current study suggest that the gaze model’s direct hand access is necessary for the social gaze cues to influence movement execution."

- title: "The paradox of information abundance: Answers provided by popular information-seeking tools lead to differences in trust, memorability and desire for more information"
  authors: "Merryn Constable, Jason Rajsic, Liz Renner, Lawrence Taylor"
  year: "2025"
  month: "09"
  day: "01"
  journal: "Telematics and Informatics"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1016/j.tele.2025.102311"
  url: "https://doi.org/10.1016/j.tele.2025.102311"
  description: "Search engines and AI tools organise, process, and make the world’s information easily available. By leveraging learned statistical properties within natural language, AI tools have the potential to provide information in a format that is easy to process. The format potentially minimises cognitive load, maximising the information users successfully integrate within memory. We explore how information seekers evaluate information relative to output (ChatGPT and Google’s Featured Snippets) and query type (trivia, e.g., the largest city in Venezuela, and ‘how-to’ or instructions for actions, e.g., how to stand on a surfboard). Participants input a series of twenty queries into a search box and viewed the text output of each tool’s response to these queries. They then rated the trustworthiness, ease of understanding of each response, and their desire to seek additional information. The response was presented without the context of the search tool to ensure that any effects were not confounded by features of the display or preconceived biases associated with a given search tool. Participants then completed an unanticipated multiple-choice test on the material. Participants found the more detailed responses to how-to queries offered by ChatGPT more trustworthy and informative than the more direct and concise responses from Google. Paradoxically, Google answers to these how-to queries resulted in higher recognition scores at test. We discuss these results in relation to how stylistic aspects of generative AI can result in meta-cognitive failure based on the cognitive heuristics of fluency and the paradox of information abundance."

