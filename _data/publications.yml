- title: "Evaluating the relative contributions of copying and reconstruction processes in cultural transmission episodes"
  authors: "James W. A. Strachan, Arianna Curioni, Merryn D. Constable, Günther Knoblich, Mathieu Charbonneau"
  year: "2021"
  month: "09"
  day: "16"
  journal: "PLoS One"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1371/journal.pone.0256901"
  url: "https://doi.org/10.1371/journal.pone.0256901"
  description: "The ability to transmit information between individuals through social learning is a foundational component of cultural evolution. However, how this transmission occurs is still debated. On the one hand, the copying account draws parallels with biological mechanisms for genetic inheritance, arguing that learners copy what they observe and novel variations occur through random copying errors. On the other hand, the reconstruction account claims that, rather than directly copying behaviour, learners reconstruct the information that they believe to be most relevant on the basis of pragmatic inference, environmental and contextual cues. Distinguishing these two accounts empirically is difficult based on data from typical transmission chain studies because the predictions they generate frequently overlap. In this study we present a methodological approach that generates different predictions of these accounts by manipulating the task context between model and learner in a transmission episode. We then report an empirical proof-of-concept that applies this approach. The results show that, when a model introduces context-dependent embedded signals to their actions that are not intended to be transmitted, it is possible to empirically distinguish between competing predictions made by these two accounts. Our approach can therefore serve to understand the underlying cognitive mechanisms at play in cultural transmission and can make important contributions to the debate between preservative and reconstructive schools of thought."

- title: "Self-bias effect: movement initiation to self-owned property is speeded for both approach and avoidance actions"
  authors: "Tara Barton, Merryn D. Constable, Samuel Sparks, Ada Kritikos"
  year: "2021"
  month: "06"
  day: "01"
  journal: "Psychological Research"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1007/s00426-020-01325-0"
  url: "https://doi.org/10.1007/s00426-020-01325-0"
  description: "Recall of, and physical interaction with, self-owned items is privileged over items owned by other people (Constable et al. in Cognition 119(3):430–437, 2011; Cunningham et al. in Conscious Cognit 17(1):312–318, 2008). Here, we investigate approach (towards the item), compared with avoidance (away from the item) movements to images of self- and experimenter-owned items. We asked if initiation time and movement duration of button-press approach responses to self-owned items are associated with a systematic self-bias (overall faster responses), compared with avoidance movements, similar to findings of paradigms investigating affective evaluation of (unowned) items. Participants were gifted mugs to use, and after a few days they completed an approach–avoidance task (Chen and Bargh in Pers Soc Psychol Bull 25(2):215–224, 1999; Seibt et al. in J Exp Soc Psychol 44:713–720, 2008; Truong et al. in J Exp Psychol Hum Percept Perform 42(3), 375-385, 2016) to images of their own or the experimenter’s mug, using either congruent or incongruent movement direction mappings. There was a self-bias effect for initiation time to the self-owned mug, for both congruent and incongruent mappings, and for movement duration in the congruent mapping. The effect was abolished in Experiment 2 when participants responded based on a shape on the handle rather than mug ownership. We speculate that ownership status requires conscious processing to modulate responses. Moreover, ownership status judgements and affective evaluation may employ different mechanisms."

