- title: "Sticking together?: Re-binding previous other-associated stimuli interferes with self-verification but not partner-verification"
  authors: "Merryn D Constable, Günther Knoblich"
  year: "2020"
  month: "10"
  day: "01"
  journal: "Acta Psychologica"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1016/j.actpsy.2020.103167"
  url: "https://doi.org/10.1016/j.actpsy.2020.103167"
  description: "The self-prioritisation and we-prioritisation effects can be observed through faster responses to self-stimuli (self and group) than non-self-stimuli. It remains uncertain if we-prioritisation extends to individual members of one's own group. In light of recent work that implicates memory-based processes in identity-prioritisation effects, the present experiment was developed to determine whether a task-partner's identity relevant information also benefits from an enhanced representation, despite conflicting evidence of partner-prioritisation. To this end, pairs of participants were recruited to perform a joint task. Each partner was assigned a shape and a stranger was also assigned a shape. Participants then completed a shape-to-label matching task where one participant responded if a shape and a label pair matched and the other responded if the shape and a label pair did not match. Halfway through the task the associated identities were switched such that the same shapes and labels were reassigned. Overall, a standard self-prioritisation effect was observed with match-responders making faster responses to self- over partner- and stranger-stimuli. After identities were remapped a decrement in performance was observed for self-trials relative to baseline self-responses. Conversely, responses were faster to partner- and stranger-stimuli relative to baseline performance for each stimulus type. Thus, no evidence was observed for an enhanced representation for task-partner-associated identities. However, an interaction between old and new memory traces for self- and other-associated identities does seem to interfere with self-retrieval and self-verification processes."

- title: "It goes with the territory: Ownership across spatial boundaries"
  authors: "James W A Strachan, Merryn D Constable, Günther Knoblich"
  year: "2020"
  month: "08"
  day: ""
  journal: "Journal of Experimental Psychology: Human Perception and Performance"
  volume: ""
  issue: ""
  pages: ""
  doi: "10.1037/xhp0000742"
  url: "https://doi.org/10.1037/xhp0000742"
  description: "Previous studies have shown that people are faster to process objects that they own as compared with objects that other people own. Yet object ownership is embedded within a social environment that has distinct and sometimes competing rules for interaction. Here we ask whether ownership of space can act as a filter through which we process what belongs to us. Can a sense of territory modulate the well-established benefits in information processing that owned objects enjoy? In 4 experiments participants categorized their own or another person's objects that appeared in territories assigned either to themselves or to another. We consistently found that faster processing of self-owned than other-owned objects only emerged for objects appearing in the self-territory, with no such advantage in other territories. We propose that knowing whom spaces belong to may serve to define the space in which affordances resulting from ownership lead to facilitated processing."

