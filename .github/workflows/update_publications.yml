name: Update publications from ORCID

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch ORCID publications
        run: |
          python scripts/orcid_to_yaml.py

      - name: Commit updated publications
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add _data/publications.yml
          git diff --staged --quiet || git commit -m "Update publications from ORCID"
          git push
